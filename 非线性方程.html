<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>非线性方程 · 数值计算器</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="theme-nonlin">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back-btn" href="index.html">← 首页</a>
      <div class="titles">
        <h1>非线性方程求根</h1>
        <p>二分法 · 牛顿法 · 弦截法，可按精度或按次数停止</p>
      </div>
    </div>
  </header>

  <main class="shell">
    <nav class="tabs" role="tablist" aria-label="求根方法">
      <button type="button" class="tab active" role="tab" data-method="1" onclick="selectMethod(1)">二分法</button>
      <button type="button" class="tab" role="tab" data-method="2" onclick="selectMethod(2)">牛顿法</button>
      <button type="button" class="tab" role="tab" data-method="3" onclick="selectMethod(3)">弦截法</button>
    </nav>

    <div class="workspace">

      <div class="stack">

        <section class="card">
          <h2 class="card-title">方程与参数</h2>

          <label class="field">
            <span>函数 f(x)（求 f(x) = 0 的根）</span>
            <input type="text" id="equation" placeholder="例如 x^3-x-1、sin(x)-0.5" data-enter="solveNonlinear" />
          </label>

          <div class="field-grid" id="bisectFields">
            <label class="field">
              <span>区间左端 a</span>
              <input type="text" id="aValue" placeholder="例如 1" data-enter="solveNonlinear" />
            </label>
            <label class="field">
              <span>区间右端 b</span>
              <input type="text" id="bValue" placeholder="例如 2" data-enter="solveNonlinear" />
            </label>
          </div>

          <label class="field" id="newtonField">
            <span>初值 x₀</span>
            <input type="text" id="x0Value" placeholder="例如 1.5" data-enter="solveNonlinear" />
          </label>

          <div class="field-grid" id="secantFields">
            <label class="field">
              <span>初值 x₀</span>
              <input type="text" id="s0Value" placeholder="例如 1" data-enter="solveNonlinear" />
            </label>
            <label class="field">
              <span>初值 x₁</span>
              <input type="text" id="s1Value" placeholder="例如 2" data-enter="solveNonlinear" />
            </label>
          </div>

          <div class="field-grid">
            <label class="field">
              <span>精度 tol</span>
              <input type="text" id="tolerance" value="0.000001" placeholder="例如 1e-6" />
            </label>
            <label class="field">
              <span id="maxIterLabel">二分次数上限 N</span>
              <input type="text" id="maxIter" value="50" placeholder="例如 30" />
            </label>
          </div>

          <div class="field">
            <span>停止条件</span>
            <div class="tabs tabs-compact" id="stopTabs">
              <button type="button" class="tab active" data-stop="tol" onclick="setStopMode('tol')">达到精度即停</button>
              <button type="button" class="tab" data-stop="count" onclick="setStopMode('count')">跑满指定次数</button>
            </div>
          </div>

          <p class="algo-hint" id="methodHint"></p>

          <div class="actions">
            <button type="button" class="btn btn-primary" onclick="solveNonlinear()">求 解</button>
            <button type="button" class="btn btn-ghost" onclick="clearInputs()">清 除</button>
          </div>

          <div class="examples">
            <p>快速示例</p>
            <div class="example-row">
              <button type="button" class="example"
                onclick="useExample('x^3-x-1', '1', '2', '1.5', '1', '2')">x³−x−1=0</button>
              <button type="button" class="example"
                onclick="useExample('x^2-2', '0', '2', '1', '1', '2')">x²−2=0</button>
              <button type="button" class="example"
                onclick="useExample('sin(x)-0.5', '0', '1', '1', '0', '1')">sin x−0.5=0</button>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">结果</h2>
            <button type="button" class="btn btn-ghost btn-sm" onclick="copyResult('result')">复制结果</button>
          </div>
          <p id="result" class="result" data-empty="填写方程与初始值后点击“求解”"></p>
        </section>

        <section class="card" id="stepsCard" style="display:none">
          <div class="card-head">
            <h2 class="card-title">迭代过程</h2>
            <button type="button" class="btn btn-ghost btn-sm" onclick="copySteps()">复制过程</button>
          </div>
          <div class="steps" id="steps"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2 class="card-title">迭代图示</h2>
          </div>
          <div class="chart-box">
            <canvas id="chart" class="chart" role="img" aria-label="函数曲线与迭代点示意图"></canvas>
          </div>
          <p class="chart-tip" id="chartTip">求解后这里会画出 f(x) 曲线、迭代点，以及求得的根。</p>
        </section>

      </div>

      <aside class="card side">
        <h2 class="card-title">输入面板</h2>
        <p class="card-note">符号插入到光标所在的输入框；字段较多时可用上方标签切换。</p>

        <div class="chips">
          <button type="button" class="chip chip-key" onclick="insertSymbol('x')">x</button>
          <button type="button" class="chip" onclick="insertSymbol('^')">x<sup>y</sup></button>
          <button type="button" class="chip" onclick="insertSymbol('(')">(</button>
          <button type="button" class="chip" onclick="insertSymbol(')')">)</button>
          <button type="button" class="chip" onclick="insertSymbol('sqrt()')">√</button>
          <button type="button" class="chip" onclick="insertSymbol('pi')">π</button>
          <button type="button" class="chip" onclick="insertSymbol('e')">e</button>
          <button type="button" class="chip" onclick="insertSymbol('sin()')">sin</button>
          <button type="button" class="chip" onclick="insertSymbol('cos()')">cos</button>
          <button type="button" class="chip" onclick="insertSymbol('tan()')">tan</button>
          <button type="button" class="chip" onclick="insertSymbol('ln()')">ln</button>
          <button type="button" class="chip" onclick="insertSymbol('log10()')">log</button>
        </div>

        <div class="keypad">
          <button type="button" class="key" onclick="insertSymbol('7')">7</button>
          <button type="button" class="key" onclick="insertSymbol('8')">8</button>
          <button type="button" class="key" onclick="insertSymbol('9')">9</button>
          <button type="button" class="key op" onclick="insertSymbol('/')">÷</button>

          <button type="button" class="key" onclick="insertSymbol('4')">4</button>
          <button type="button" class="key" onclick="insertSymbol('5')">5</button>
          <button type="button" class="key" onclick="insertSymbol('6')">6</button>
          <button type="button" class="key op" onclick="insertSymbol('*')">×</button>

          <button type="button" class="key" onclick="insertSymbol('1')">1</button>
          <button type="button" class="key" onclick="insertSymbol('2')">2</button>
          <button type="button" class="key" onclick="insertSymbol('3')">3</button>
          <button type="button" class="key op" onclick="insertSymbol('-')">−</button>

          <button type="button" class="key" onclick="insertSymbol('0')">0</button>
          <button type="button" class="key" onclick="insertSymbol('.')">.</button>
          <button type="button" class="key back" onclick="backspace()">⌫</button>
          <button type="button" class="key op" onclick="insertSymbol('+')">+</button>
        </div>
      </aside>

    </div>
  </main>

  <div id="toast" class="toast">已复制</div>

  <script src="js/nerdamer.core.js"></script>
  <script src="js/Algebra.js"></script>
  <script src="js/Calculus.js"></script>
  <script src="js/Solve.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/history.js"></script>

  <script>
    /* ==========================================================
       非线性方程求根：二分法 / 牛顿法 / 弦截法
       ========================================================== */

    var currentMethod = 1;      // 1 二分 2 牛顿 3 弦截
    var stopMode = "tol";       // tol 达到精度即停 / count 跑满次数

    var methodInfo = {
      1: {
        hint: "二分法：要求 f(a)·f(b) < 0。每次把区间对半分，取中点作为近似根，误差上界为 (b−a)/2。只需二分 k 次就能把误差压到 (b−a)/2ᵏ，所以二分次数可由精度直接算出。",
        fields: "bisect"
      },
      2: {
        hint: "牛顿法：x₍ₖ₊₁₎ = xₖ − f(xₖ)/f′(xₖ)，需要导数不为零；收敛快（平方收敛），但对初值敏感。",
        fields: "newton"
      },
      3: {
        hint: "弦截法：用两点连线与 x 轴的交点迭代，x₍ₖ₊₁₎ = xₖ − f(xₖ)(xₖ−x₍ₖ₋₁₎)/(f(xₖ)−f(x₍ₖ₋₁₎))，不需要导数。",
        fields: "secant"
      }
    };

    /* ---------- 表达式预处理（与其它页面一致） ---------- */

    function myParse(expression) {
      theString = stripSpaces(expression);
      with (Math) {
        theString = replaceSubstring(theString, ")(", ")*(");
        theString = replaceSubstring(theString, ")ln", ")*ln");
        theString = replaceSubstring(theString, ")log", ")*log");
        theString = replaceSubstring(theString, ")sin", ")*sin");
        theString = replaceSubstring(theString, ")cos", ")*cos");
        theString = replaceSubstring(theString, ")e", ")*e");

        theString = replaceSubstring(theString, "log10", "log");

        theString = putProduct(theString);
        theString = replaceSubstring(theString, "log", "(1/log(10))*log");
        theString = replaceSubstring(theString, "ln", "log");
        theString = replaceChar(theString, "X", "x");
      } // with Math
      return (theString);
    }

    function replaceChar(InString, oldSymbol, newSymbol) {
      OutString = "";
      for (Count = 0; Count < InString.length; Count++) {
        TempChar = InString.substring(Count, Count + 1);
        if (TempChar != oldSymbol)
          OutString = OutString + TempChar
        else OutString = OutString + newSymbol;
      }
      return (OutString);
    }

    function replaceSubstring(InString, oldSubstring, newSubstring) {
      OutString = "";
      var sublength = oldSubstring.length;
      for (Count = 0; Count < InString.length; Count++) {
        TempStr = InString.substring(Count, Count + sublength);
        TempChar = InString.substring(Count, Count + 1);
        if (TempStr != oldSubstring)
          OutString = OutString + TempChar
        else {
          OutString = OutString + newSubstring;
          Count += sublength - 1
        }
      }
      return (OutString);
    }

    function isNumberChar(InString) {
      if (InString.length != 1)
        return (false);
      RefString = "1234567890)";
      if (RefString.indexOf(InString, 0) == -1)
        return (false);
      return (true);
    }

    function isCharHere(InString, RefString) {
      if (InString.length != 1)
        return (false);
      if (RefString.indexOf(InString, 0) == -1)
        return (false);
      return (true);
    }

    function putProduct(InString) {
      OutString = "";
      for (Count = 0; Count < InString.length; Count++) {
        TempChar = InString.substring(Count, Count + 1);
        if (!isCharHere(TempChar, "xXeslcapdDuU(") || (Count == 0)) { OutString = OutString + TempChar }
        else {
          if (isNumberChar(InString.substring(Count - 1, Count))) { OutString = OutString + "*" + TempChar }
          else OutString = OutString + TempChar
        }
      }
      return (OutString);
    }

    function stripSpaces(InString) {
      var OutString = "";
      for (Count = 0; Count < InString.length; Count++) {
        var TempChar = InString.substring(Count, Count + 1);
        if (TempChar != " ")
          OutString = OutString + TempChar;
      }
      return (OutString);
    }

    /* ---------- 页面交互 ---------- */

    function selectMethod(num) {
      currentMethod = num;
      var info = methodInfo[num];

      var tabs = document.querySelectorAll(".tabs .tab[data-method]");
      for (var i = 0; i < tabs.length; i++) {
        var isActive = tabs[i].getAttribute("data-method") == String(num);
        tabs[i].className = isActive ? "tab active" : "tab";
        tabs[i].setAttribute("aria-selected", isActive ? "true" : "false");
      }

      document.getElementById("bisectFields").style.display = info.fields === "bisect" ? "" : "none";
      document.getElementById("newtonField").style.display = info.fields === "newton" ? "" : "none";
      document.getElementById("secantFields").style.display = info.fields === "secant" ? "" : "none";
      document.getElementById("methodHint").innerHTML = info.hint;

      // 二分法每一步把区间对半，次数是“二分次数”，不是笼统的迭代次数
      var label = document.getElementById("maxIterLabel");
      var maxIterInput = document.getElementById("maxIter");
      if (label) label.textContent = num === 1 ? "二分次数上限 N" : "最大迭代次数 N";
      if (maxIterInput) maxIterInput.placeholder = num === 1 ? "例如 30" : "例如 50";

      // 当前编辑的输入框若被隐藏，退回函数输入框
      var hiddenIds = info.fields === "bisect" ? ["x0Value", "s0Value", "s1Value"]
        : (info.fields === "newton" ? ["aValue", "bValue", "s0Value", "s1Value"]
          : ["aValue", "bValue", "x0Value"]);
      for (var j = 0; j < hiddenIds.length; j++) {
        if (ElementId === hiddenIds[j]) ElementId = "equation";
      }

      syncEcho();
      hideSteps();
    }

    function setStopMode(mode) {
      stopMode = mode;
      var tabs = document.querySelectorAll("#stopTabs .tab");
      for (var i = 0; i < tabs.length; i++) {
        var isActive = tabs[i].getAttribute("data-stop") === mode;
        tabs[i].className = isActive ? "tab active" : "tab";
        tabs[i].setAttribute("aria-selected", isActive ? "true" : "false");
      }
    }

    function useExample(equation, a, b, x0, s0, s1) {
      document.getElementById("equation").value = equation;
      document.getElementById("aValue").value = a;
      document.getElementById("bValue").value = b;
      document.getElementById("x0Value").value = x0;
      document.getElementById("s0Value").value = s0;
      document.getElementById("s1Value").value = s1;
      solveNonlinear();
    }

    function clearInputs() {
      clearFields(["equation", "aValue", "bValue", "x0Value", "s0Value", "s1Value"]);
      document.getElementById("result").innerHTML = "";
      hideSteps();
      chartData.fn = null;
      chartData.points = [];
      chartData.root = null;
      drawChart();
      document.getElementById("chartTip").textContent = "求解后这里会画出 f(x) 曲线、迭代点，以及求得的根。";
    }

    function readNumber(id) {
      var el = document.getElementById(id);
      if (!el) return NaN;
      var text = stripSpaces(el.value);
      if (text === "") return NaN;
      return Number(text);
    }

    function fmtNum(v) {
      if (!isFinite(v)) return "—";
      if (v === 0) return "0";
      var abs = Math.abs(v);
      if (abs >= 1e6 || abs < 1e-6) return v.toExponential(6);
      return String(Number(v.toPrecision(10)));
    }

    /* ---------- 三种算法 ---------- */

    function bisection(f, a0, b0, tol, maxIter, useTol) {
      var a = a0, b = b0;
      var fa = f(a), fb = f(b);

      if (!isFinite(fa) || !isFinite(fb)) return { error: "端点处的函数值无法计算，请检查函数与定义域。" };
      if (fa === 0) return { recs: [], root: a, iterations: 0, reason: "exact", domain: [a0, b0] };
      if (fb === 0) return { recs: [], root: b, iterations: 0, reason: "exact", domain: [a0, b0] };
      if (fa * fb > 0) {
        return { error: "f(a) 与 f(b) 同号（" + fmtNum(fa) + " 与 " + fmtNum(fb) + "），二分法要求异号。" };
      }

      var recs = [], c = (a + b) / 2, fc = NaN, reason = "count";

      for (var k = 1; k <= maxIter; k++) {
        c = (a + b) / 2;
        fc = f(c);
        var err = (b - a) / 2;
        recs.push({ k: k, a: a, b: b, c: c, fc: fc, err: err });

        if (fc === 0) { reason = "exact"; break; }
        if (useTol && err <= tol) { reason = "tol"; break; }

        if (fa * fc < 0) { b = c; fb = fc; }
        else { a = c; fa = fc; }
      }

      return { recs: recs, root: c, iterations: recs.length, reason: reason, domain: [a0, b0] };
    }

    function newton(f, df, x0, tol, maxIter, useTol) {
      var recs = [], x = x0, reason = "count", xs = [x0];

      for (var k = 1; k <= maxIter; k++) {
        var fx = f(x);
        var dfx = df(x);

        if (!isFinite(fx) || !isFinite(dfx)) {
          return { error: "第 " + k + " 次迭代时函数值或导数值无效，请更换初值。" };
        }
        if (dfx === 0) {
          return { error: "第 " + k + " 次迭代导数为 0，牛顿法失效，请更换初值。" };
        }

        var xn = x - fx / dfx;
        var dx = Math.abs(xn - x);
        recs.push({ k: k, x: x, fx: fx, dfx: dfx, xn: xn, dx: dx });

        x = xn;
        xs.push(x);

        if (useTol && dx <= tol) { reason = "tol"; break; }
      }

      return { recs: recs, root: x, iterations: recs.length, reason: reason, trace: xs, x0: x0 };
    }

    function secant(f, x0, x1, tol, maxIter, useTol) {
      var recs = [], xa = x0, xb = x1, reason = "count";
      var xs = [x0, x1];

      for (var k = 1; k <= maxIter; k++) {
        var fa = f(xa), fb = f(xb);

        if (!isFinite(fa) || !isFinite(fb)) {
          return { error: "第 " + k + " 次迭代时函数值无效，请更换初值。" };
        }
        if (fb - fa === 0) {
          return { error: "x₀ 与 x₁ 处的函数值相等，弦截法无法继续，请更换初值。" };
        }

        var xn = xb - fb * (xb - xa) / (fb - fa);
        var dx = Math.abs(xn - xb);
        recs.push({ k: k, a: xa, b: xb, fa: fa, fb: fb, xn: xn, dx: dx });

        xa = xb;
        xb = xn;
        xs.push(xn);

        if (useTol && dx <= tol) { reason = "tol"; break; }
      }

      return { recs: recs, root: xb, iterations: recs.length, reason: reason, trace: xs, x0: x0, x1: x1 };
    }

    /* ---------- 求解入口 ---------- */

    function showError(message) {
      document.getElementById("result").innerHTML = message;
      hideSteps();
      chartData.fn = null;
      chartData.points = [];
      chartData.root = null;
      drawChart();
    }

    function solveNonlinear() {
      var equationText = document.getElementById("equation").value;

      if (stripSpaces(equationText) === "") { showError("请输入函数."); return; }

      var expr = myParse(equationText);
      var f, df = null;

      try {
        f = nerdamer(expr).buildFunction(["x"]);
      } catch (e) {
        showError("表达式无法解析：请检查函数写法（自变量用 x 表示）。");
        return;
      }

      if (currentMethod === 2) {
        try {
          df = nerdamer.diff(expr, "x").buildFunction(["x"]);
        } catch (e) {
          showError("无法解析导数，请改用二分法或弦截法。");
          return;
        }
      }

      var tol = readNumber("tolerance");
      var maxIter = readNumber("maxIter");

      var iterLabel = currentMethod === 1 ? "二分次数上限 N" : "最大迭代次数 N";

      if (!(tol > 0)) { showError("精度 tol 必须是正数。"); return; }
      if (!(maxIter >= 1) || Math.floor(maxIter) !== maxIter) {
        showError(iterLabel + " 必须是正整数。"); return;
      }
      if (maxIter > 10000) { showError(iterLabel + " 过大，请不超过 10000。"); return; }

      var useTol = stopMode === "tol";
      var out, a0 = NaN, b0 = NaN;

      if (currentMethod === 1) {
        a0 = readNumber("aValue");
        b0 = readNumber("bValue");
        if (isNaN(a0) || isNaN(b0)) { showError("请填写区间端点 a 与 b。"); return; }
        if (a0 === b0) { showError("区间端点不能相同。"); return; }
        if (a0 > b0) { var t = a0; a0 = b0; b0 = t; }
        out = bisection(f, a0, b0, tol, maxIter, useTol);
      } else if (currentMethod === 2) {
        var x0 = readNumber("x0Value");
        if (isNaN(x0)) { showError("请填写初值 x₀。"); return; }
        out = newton(f, df, x0, tol, maxIter, useTol);
      } else {
        var s0 = readNumber("s0Value");
        var s1 = readNumber("s1Value");
        if (isNaN(s0) || isNaN(s1)) { showError("请填写初值 x₀ 与 x₁。"); return; }
        if (s0 === s1) { showError("两个初值不能相同。"); return; }
        out = secant(f, s0, s1, tol, maxIter, useTol);
      }

      if (out.error) { showError(out.error); return; }

      chartData.fn = f;   // 结果里的 f(x*) 需要它
      renderResult(out, tol, maxIter, useTol);
      renderSteps(out, tol, maxIter, useTol);
      renderChart(f, df, out);
      NCHistory.record();
    }

    /* ---------- 结果与过程 ---------- */

    // 二分法的循环叫“二分”更贴切，牛顿/弦截才叫“迭代”
    function countWord() {
      return currentMethod === 1 ? "二分" : "迭代";
    }

    function reasonText(out, tol, useTol) {
      if (out.reason === "exact") return "函数值恰好为 0，已得到精确根";
      if (out.reason === "tol") return "达到精度要求 tol = " + fmtNum(tol);
      return useTol
        ? "未达到精度，已" + countWord() + " " + out.iterations + " 次"
        : "按次数停止（共 " + out.iterations + " 次）";
    }

    function renderResult(out, tol, maxIter, useTol) {
      var froot;
      try { froot = chartData.fn ? chartData.fn(out.root) : NaN; } catch (e) { froot = NaN; }

      var html = "近似根 x* ≈ " + fmtNum(out.root) + "<br>";
      html += "f(x*) = " + fmtNum(froot) + "<br>";
      html += countWord() + " " + out.iterations + " 次 · " + reasonText(out, tol, useTol);
      document.getElementById("result").innerHTML = html;
    }

    function renderSteps(out, tol, maxIter, useTol) {
      var card = document.getElementById("stepsCard");
      var box = document.getElementById("steps");
      if (!card || !box) return;

      var html = "";
      html += '<p class="step-line"><b>方程</b> f(x) = ' +
        escapeText(stripSpaces(document.getElementById("equation").value)) + ' = 0</p>';
      html += '<p class="step-line"><b>方法</b> ' + methodName() + '；<b>停止条件</b> ' +
        (useTol ? "达到精度 tol = " + fmtNum(tol)
          : (currentMethod === 1 ? "最多二分 " : "跑满 ") + fmtNum(maxIter) + " 次") + '</p>';

      if (currentMethod === 1) html += bisectStepsHtml(out, tol, maxIter, useTol);
      else if (currentMethod === 2) html += newtonStepsHtml(out);
      else html += secantStepsHtml(out);

      html += '<p class="step-line"><b>结果</b> x* ≈ ' + fmtNum(out.root) + '（' + countWord() + ' ' +
        out.iterations + ' 次，' + reasonText(out, tol, useTol) + '）</p>';

      box.innerHTML = html;
      card.style.display = "";
    }

    function hideSteps() {
      var card = document.getElementById("stepsCard");
      if (card) card.style.display = "none";
    }

    function methodName() {
      return currentMethod === 1 ? "二分法" : (currentMethod === 2 ? "牛顿法" : "弦截法");
    }

    function escapeText(text) {
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function pickRows(list, head, tail) {
      if (list.length <= head + tail) return list.map(function (v, i) { return i; });
      var idx = [];
      for (var i = 0; i < head; i++) idx.push(i);
      idx.push(-1);
      for (var j = list.length - tail; j < list.length; j++) idx.push(j);
      return idx;
    }

    function bisectStepsHtml(out, tol, maxIter, useTol) {
      var html = "";
      var width = out.domain[1] - out.domain[0];
      html += '<p class="step-line"><b>初始区间</b> [' + fmtNum(out.domain[0]) + ', ' + fmtNum(out.domain[1]) +
        ']，区间长度 ' + fmtNum(width) + '</p>';
      html += '<p class="step-formula">每次取中点 xₖ = (a + b)/2，判断 f(xₖ) 与 f(a) 是否异号：异号则根在左半区间（b ← xₖ），否则在右半（a ← xₖ）；误差上界为 (b − a)/2</p>';

      if (useTol) {
        if (width <= tol) {
          html += '<p class="step-line"><b>所需二分次数</b> 区间长度已不超过 tol，二分 1 次即可达到精度</p>';
        } else {
          var raw = Math.log(width / tol) / Math.LN2;
          var need = Math.ceil(raw);
          html += '<p class="step-line"><b>所需二分次数</b> 由 (b − a)/2ᵏ ≤ tol 得 k ≥ log₂((b − a)/tol) = ' +
            fmtNum(Number(raw.toPrecision(4))) + '，至少 ' + need + ' 次' +
            (out.reason === "tol" ? '（本次二分 ' + out.iterations + ' 次达到精度）' : '') + '</p>';
        }
      }

      if (out.recs.length === 0) {
        html += '<p class="step-note">端点函数值恰为 0，无需二分。</p>';
        return html;
      }

      html += '<div class="step-table-wrap"><table class="step-table"><thead><tr>' +
        '<th>k</th><th>a</th><th>b</th><th>xₖ = (a+b)/2</th><th>f(xₖ)</th><th>(b−a)/2</th>' +
        '</tr></thead><tbody>';

      var idx = pickRows(out.recs, 8, 5);
      for (var i = 0; i < idx.length; i++) {
        if (idx[i] < 0) { html += '<tr class="ellipsis"><td colspan="6">⋯⋯</td></tr>'; continue; }
        var r = out.recs[idx[i]];
        html += '<tr><td>' + r.k + '</td><td>' + fmtNum(r.a) + '</td><td>' + fmtNum(r.b) + '</td>' +
          '<td>' + fmtNum(r.c) + '</td><td>' + fmtNum(r.fc) + '</td><td>' + fmtNum(r.err) + '</td></tr>';
      }
      html += '</tbody></table></div>';

      if (out.recs.length > idx.length) {
        html += '<p class="step-note">表中只列出部分二分（共 ' + out.recs.length + ' 次）。</p>';
      }
      return html;
    }

    function newtonStepsHtml(out) {
      var html = "";
      html += '<p class="step-line"><b>迭代公式</b> x₍ₖ₊₁₎ = xₖ − f(xₖ)/f′(xₖ)，初值 x₀ = ' + fmtNum(out.x0) + '</p>';
      html += '<p class="step-formula">在 xₖ 处用切线代替曲线，切线与 x 轴的交点即为下一个近似值；相邻两次结果之差 |x₍ₖ₊₁₎ − xₖ| 作为误差估计</p>';

      html += '<div class="step-table-wrap"><table class="step-table"><thead><tr>' +
        '<th>k</th><th>xₖ</th><th>f(xₖ)</th><th>f′(xₖ)</th><th>x₍ₖ₊₁₎</th><th>|Δx|</th>' +
        '</tr></thead><tbody>';

      var idx = pickRows(out.recs, 8, 5);
      for (var i = 0; i < idx.length; i++) {
        if (idx[i] < 0) { html += '<tr class="ellipsis"><td colspan="6">⋯⋯</td></tr>'; continue; }
        var r = out.recs[idx[i]];
        html += '<tr><td>' + r.k + '</td><td>' + fmtNum(r.x) + '</td><td>' + fmtNum(r.fx) + '</td>' +
          '<td>' + fmtNum(r.dfx) + '</td><td>' + fmtNum(r.xn) + '</td><td>' + fmtNum(r.dx) + '</td></tr>';
      }
      html += '</tbody></table></div>';

      if (out.recs.length > idx.length) {
        html += '<p class="step-note">表中只列出部分迭代（共 ' + out.recs.length + ' 次）。</p>';
      }
      return html;
    }

    function secantStepsHtml(out) {
      var html = "";
      html += '<p class="step-line"><b>迭代公式</b> x₍ₖ₊₁₎ = xₖ − f(xₖ)·(xₖ − x₍ₖ₋₁₎)/(f(xₖ) − f(x₍ₖ₋₁₎))，初值 x₀ = ' +
        fmtNum(out.x0) + '，x₁ = ' + fmtNum(out.x1) + '</p>';
      html += '<p class="step-formula">用过两点 (x₍ₖ₋₁₎, f(x₍ₖ₋₁₎))、(xₖ, f(xₖ)) 的割线与 x 轴的交点作为下一个近似值（用差商代替导数）</p>';

      html += '<div class="step-table-wrap"><table class="step-table"><thead><tr>' +
        '<th>k</th><th>x₍ₖ₋₁₎</th><th>xₖ</th><th>f(x₍ₖ₋₁₎)</th><th>f(xₖ)</th><th>x₍ₖ₊₁₎</th><th>|Δx|</th>' +
        '</tr></thead><tbody>';

      var idx = pickRows(out.recs, 8, 5);
      for (var i = 0; i < idx.length; i++) {
        if (idx[i] < 0) { html += '<tr class="ellipsis"><td colspan="7">⋯⋯</td></tr>'; continue; }
        var r = out.recs[idx[i]];
        html += '<tr><td>' + r.k + '</td><td>' + fmtNum(r.a) + '</td><td>' + fmtNum(r.b) + '</td>' +
          '<td>' + fmtNum(r.fa) + '</td><td>' + fmtNum(r.fb) + '</td><td>' + fmtNum(r.xn) + '</td>' +
          '<td>' + fmtNum(r.dx) + '</td></tr>';
      }
      html += '</tbody></table></div>';

      if (out.recs.length > idx.length) {
        html += '<p class="step-note">表中只列出部分迭代（共 ' + out.recs.length + ' 次）。</p>';
      }
      return html;
    }

    function copySteps() {
      var card = document.getElementById("stepsCard");
      var box = document.getElementById("steps");
      if (!card || card.style.display === "none" || !box || !box.textContent.trim()) {
        showToast("还没有可复制的过程");
        return;
      }
      copyText(box.innerText || box.textContent);
    }

    /* ==========================================================
       迭代图示：曲线 + 迭代点 + 根 + 切线/割线
       ========================================================== */

    var chartData = {
      fn: null,
      df: null,
      points: [],      // [{x, y, label}]
      root: null,
      tangent: null,   // {x, y, slope}
      secant: null,    // {x1, y1, x2, y2}
      domain: null     // [a, b] 优先的横轴范围
    };

    function chartCssVar(name, fallback) {
      var value = getComputedStyle(document.body).getPropertyValue(name);
      return (value && value.trim()) || fallback;
    }

    function chartTick(value) {
      if (value === 0) return "0";
      var abs = Math.abs(value);
      if (abs >= 10000 || abs < 0.001) return value.toExponential(0);
      return String(Number(value.toPrecision(6)));
    }

    function niceStep(span, target) {
      var raw = span / Math.max(1, target);
      var magnitude = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      var norm = raw / magnitude;
      var step;
      if (norm <= 1) step = 1;
      else if (norm <= 2) step = 2;
      else if (norm <= 2.5) step = 2.5;
      else if (norm <= 5) step = 5;
      else step = 10;
      return step * magnitude;
    }

    function chartRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function safeCall(fn, x) {
      if (!fn) return NaN;
      try {
        var y = fn(x);
        if (typeof y !== "number" || !isFinite(y) || Math.abs(y) > 1e12) return NaN;
        return y;
      } catch (e) {
        return NaN;
      }
    }

    function renderChart(f, df, out) {
      var points = [];
      var i;

      if (currentMethod === 1) {
        for (i = 0; i < out.recs.length && i < 40; i++) {
          points.push({ x: out.recs[i].c, y: out.recs[i].fc });
        }
        chartData.secant = null;
        chartData.tangent = null;
      } else if (currentMethod === 2) {
        for (i = 0; i < out.recs.length && i < 40; i++) {
          points.push({ x: out.recs[i].x, y: out.recs[i].fx });
        }
        chartData.tangent = {
          x: out.x0,
          y: safeCall(f, out.x0),
          slope: safeCall(df, out.x0)
        };
        chartData.secant = null;
      } else {
        for (i = 0; i < out.recs.length && i < 40; i++) {
          points.push({ x: out.recs[i].b, y: out.recs[i].fb });
        }
        chartData.secant = {
          x1: out.x0, y1: safeCall(f, out.x0),
          x2: out.x1, y2: safeCall(f, out.x1)
        };
        chartData.tangent = null;
      }

      chartData.fn = f;
      chartData.df = df;
      chartData.points = points;
      chartData.root = out.root;
      chartData.domain = out.domain || null;

      var tip = document.getElementById("chartTip");
      if (tip) {
        tip.textContent = "曲线为 f(x)，圆点为各次迭代的近似值，虚线为" +
          (currentMethod === 2 ? "初值处的切线" : (currentMethod === 3 ? "两个初值间的割线" : "根的位置")) +
          "；右端标签标出求得的根。";
      }

      drawChart();
    }

    function drawChart() {
      var canvas = document.getElementById("chart");
      if (!canvas) return;

      var width = canvas.clientWidth;
      var height = canvas.clientHeight;
      if (!width || !height) return;

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }

      var ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);

      var accent = chartCssVar("--accent", "#0ea5e9");
      var accent2 = chartCssVar("--accent-2", "#6366f1");
      var accentInk = chartCssVar("--accent-ink", "#0369a1");
      var gridColor = chartCssVar("--line", "#e6e9f6");
      var muted = chartCssVar("--muted", "#6c7496");

      if (!chartData.fn) {
        ctx.font = "13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif";
        ctx.fillStyle = muted;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("求解后显示函数曲线与迭代点", width / 2, height / 2);
        return;
      }

      // —— 横轴范围 ——
      var xs = [chartData.root];
      var i;
      for (i = 0; i < chartData.points.length; i++) xs.push(chartData.points[i].x);

      var extra = chartData.domain;
      if (!extra && chartData.secant) extra = [chartData.secant.x1, chartData.secant.x2];
      if (!extra && chartData.tangent) extra = [chartData.tangent.x];
      if (extra) { xs.push(extra[0]); xs.push(extra[1] === undefined ? extra[0] : extra[1]); }

      var minX = Math.min.apply(null, xs);
      var maxX = Math.max.apply(null, xs);
      if (!isFinite(minX) || !isFinite(maxX)) return;

      var spanX = maxX - minX;
      if (!(spanX > 1e-9)) spanX = Math.abs(maxX) * 0.2 + 1;
      var vx0 = minX - spanX * 0.25;
      var vx1 = maxX + spanX * 0.25;

      // —— 采样曲线 ——
      var count = Math.min(900, Math.max(280, Math.round(width * 1.3)));
      var ys = [];
      var samples = [];
      for (i = 0; i <= count; i++) {
        var sx = vx0 + (vx1 - vx0) * i / count;
        var sy = safeCall(chartData.fn, sx);
        samples.push(sy);
        if (isFinite(sy)) ys.push(sy);
      }

      for (i = 0; i < chartData.points.length; i++) {
        if (isFinite(chartData.points[i].y)) ys.push(chartData.points[i].y);
      }
      if (chartData.root !== null && isFinite(chartData.root)) ys.push(0);
      ys.push(0);

      if (ys.length === 0) {
        ctx.font = "13px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif";
        ctx.fillStyle = muted;
        ctx.textAlign = "center";
        ctx.fillText("当前区间内函数没有有效取值", width / 2, height / 2);
        return;
      }

      var sorted = ys.slice().sort(function (a, b) { return a - b; });
      var last = sorted.length - 1;
      var lo = sorted[0];
      var hi = sorted[last];
      var trimLo = sorted[Math.floor(last * 0.04)];
      var trimHi = sorted[Math.ceil(last * 0.96)];
      if (trimHi > trimLo && (trimHi - trimLo) < 0.6 * (hi - lo)) {
        var trimPad = (trimHi - trimLo) * 0.3;
        lo = trimLo - trimPad;
        hi = trimHi + trimPad;
      }
      if (!(hi - lo > 1e-12)) { lo -= 1; hi += 1; }
      var padY = (hi - lo) * 0.15;
      var vy0 = lo - padY;
      var vy1 = hi + padY;

      function toPx(v) { return (v - vx0) / (vx1 - vx0) * width; }
      function toPy(v) { return height - (v - vy0) / (vy1 - vy0) * height; }

      // —— 网格 ——
      var stepX = niceStep(vx1 - vx0, Math.max(2, Math.floor(width / 70)));
      var stepY = niceStep(vy1 - vy0, Math.max(2, Math.floor(height / 50)));
      var k, gx, gy, px, py;

      ctx.lineWidth = 1;
      ctx.strokeStyle = gridColor;
      for (k = Math.ceil(vx0 / stepX); k * stepX <= vx1 + 1e-9; k++) {
        px = toPx(k * stepX);
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, height);
        ctx.stroke();
      }
      for (k = Math.ceil(vy0 / stepY); k * stepY <= vy1 + 1e-9; k++) {
        py = toPy(k * stepY);
        ctx.beginPath();
        ctx.moveTo(0, py);
        ctx.lineTo(width, py);
        ctx.stroke();
      }

      // —— 坐标轴 ——
      var zeroY = (vy0 <= 0 && vy1 >= 0) ? toPy(0) : null;
      var zeroX = (vx0 <= 0 && vx1 >= 0) ? toPx(0) : null;
      ctx.strokeStyle = "rgba(23, 28, 52, 0.35)";
      ctx.lineWidth = 1.2;
      if (zeroY !== null) {
        ctx.beginPath();
        ctx.moveTo(0, zeroY);
        ctx.lineTo(width, zeroY);
        ctx.stroke();
      }
      if (zeroX !== null) {
        ctx.beginPath();
        ctx.moveTo(zeroX, 0);
        ctx.lineTo(zeroX, height);
        ctx.stroke();
      }

      // —— 刻度 ——
      ctx.font = "11px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif";
      ctx.fillStyle = muted;

      var textY = zeroY !== null ? Math.min(height - 4, zeroY + 14) : height - 6;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      for (k = Math.ceil(vx0 / stepX); k * stepX <= vx1 + 1e-9; k++) {
        gx = k * stepX;
        if (Math.abs(gx) < stepX * 1e-6) continue;
        ctx.fillText(chartTick(gx), toPx(gx), textY);
      }

      var textX = zeroX !== null ? Math.min(width - 4, zeroX - 6) : 4;
      ctx.textAlign = zeroX !== null ? "right" : "left";
      ctx.textBaseline = "middle";
      for (k = Math.ceil(vy0 / stepY); k * stepY <= vy1 + 1e-9; k++) {
        gy = k * stepY;
        if (Math.abs(gy) < stepY * 1e-6) continue;
        ctx.fillText(chartTick(gy), textX, toPy(gy));
      }

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, width, height);
      ctx.clip();

      // —— 切线 / 割线 ——
      if (chartData.tangent && isFinite(chartData.tangent.slope) && isFinite(chartData.tangent.y)) {
        var tg = chartData.tangent;
        ctx.save();
        ctx.strokeStyle = accent2;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.6;
        if (typeof ctx.setLineDash === "function") ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(toPx(vx0), toPy(tg.y + tg.slope * (vx0 - tg.x)));
        ctx.lineTo(toPx(vx1), toPy(tg.y + tg.slope * (vx1 - tg.x)));
        ctx.stroke();
        ctx.restore();
      }

      if (chartData.secant && isFinite(chartData.secant.y1) && isFinite(chartData.secant.y2)) {
        var sc = chartData.secant;
        var slope = (sc.y2 - sc.y1) / (sc.x2 - sc.x1);
        if (isFinite(slope)) {
          ctx.save();
          ctx.strokeStyle = accent2;
          ctx.globalAlpha = 0.75;
          ctx.lineWidth = 1.6;
          if (typeof ctx.setLineDash === "function") ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(toPx(vx0), toPy(sc.y1 + slope * (vx0 - sc.x1)));
          ctx.lineTo(toPx(vx1), toPy(sc.y1 + slope * (vx1 - sc.x1)));
          ctx.stroke();
          ctx.restore();
        }
      }

      // —— 曲线 ——
      var gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, accent);
      gradient.addColorStop(1, accent2);

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();

      var started = false;
      var prevY = NaN;
      var jumpLimit = (vy1 - vy0) * 3;

      for (i = 0; i <= count; i++) {
        var yy = samples[i];
        if (!isFinite(yy)) { started = false; prevY = NaN; continue; }
        px = toPx(vx0 + (vx1 - vx0) * i / count);
        py = toPy(yy);
        if (py > height * 20) py = height * 20;
        else if (py < -height * 20) py = -height * 20;

        if (!started || (isFinite(prevY) && Math.abs(yy - prevY) > jumpLimit)) {
          ctx.moveTo(px, py);
          started = true;
        } else {
          ctx.lineTo(px, py);
        }
        prevY = yy;
      }
      ctx.stroke();

      // —— 迭代点 ——
      for (i = 0; i < chartData.points.length; i++) {
        var p = chartData.points[i];
        if (!isFinite(p.x) || !isFinite(p.y)) continue;
        var ppx = toPx(p.x);
        var ppy = toPy(p.y);
        if (ppx < -10 || ppx > width + 10 || ppy < -10 || ppy > height + 10) continue;

        ctx.beginPath();
        ctx.arc(ppx, ppy, 3.2, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.fill();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = accent;
        ctx.stroke();
      }

      ctx.restore();

      // —— 根与标签 ——
      if (chartData.root !== null && isFinite(chartData.root)) {
        var rx = toPx(chartData.root);
        if (rx >= -2 && rx <= width + 2) {
          ctx.save();
          ctx.strokeStyle = accentInk;
          ctx.globalAlpha = 0.5;
          ctx.lineWidth = 1.4;
          if (typeof ctx.setLineDash === "function") ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.moveTo(rx, 0);
          ctx.lineTo(rx, height);
          ctx.stroke();
          ctx.restore();

          var ry = toPy(0);
          ctx.beginPath();
          ctx.arc(rx, ry, 5, 0, Math.PI * 2);
          ctx.fillStyle = "#fff";
          ctx.fill();
          ctx.lineWidth = 2.4;
          ctx.strokeStyle = accentInk;
          ctx.stroke();

          var label = "x* ≈ " + fmtNum(chartData.root);
          ctx.font = "600 12px 'PingFang SC','Microsoft YaHei',system-ui,sans-serif";
          var textW = ctx.measureText(label).width;
          var boxW = textW + 14;
          var boxH = 22;
          var boxX = rx + 10;
          var boxY = Math.max(4, ry - boxH - 10);
          if (boxX + boxW > width - 2) boxX = Math.max(2, rx - boxW - 10);

          chartRoundRect(ctx, boxX, boxY, boxW, boxH, 8);
          ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
          ctx.fill();
          ctx.lineWidth = 1.2;
          ctx.strokeStyle = accentInk;
          ctx.stroke();

          ctx.fillStyle = accentInk;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, boxX + boxW / 2, boxY + boxH / 2 + 0.5);
        }
      }
    }

    /* ---------- 初始化 ---------- */

    selectMethod(currentMethod);

    document.addEventListener("DOMContentLoaded", function () {
      drawChart();

      var resizeTimer = null;
      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(drawChart, 120);
      });
    });
  </script>
</body>

</html>
